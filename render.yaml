services:
  - type: web
    name: medwin-api
    runtime: ruby
    plan: free
    rootDir: backend
    buildCommand: bundle install && bin/rails db:prepare && bin/rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /doctors
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medwin-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://fayazriyaz.github.io,https://medwin-healthcare.netlify.app,capacitor://localhost,https://localhost,http://localhost,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      - key: OTP_DEBUG
        value: "true"
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false

databases:
  - name: medwin-db
    plan: free
    databaseName: medwin_db
    user: medwin_db_user
